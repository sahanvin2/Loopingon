name: CD Staging

on:
  push:
    branches: [staging]

env:
  DOCKER_REGISTRY: registry.digitalocean.com/loopingon-staging
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    name: Build & Deploy to Staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Login to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 600

      - name: Build Server Docker Image
        run: |
          docker build \
            --file apps/server/Dockerfile \
            --tag $DOCKER_REGISTRY/server:$IMAGE_TAG \
            --tag $DOCKER_REGISTRY/server:staging-latest \
            apps/server

      - name: Build Web Docker Image
        run: |
          docker build \
            --file apps/web/Dockerfile \
            --tag $DOCKER_REGISTRY/web:$IMAGE_TAG \
            --tag $DOCKER_REGISTRY/web:staging-latest \
            apps/web

      - name: Build Nginx Docker Image
        run: |
          docker build \
            --file docker/nginx/Dockerfile \
            --tag $DOCKER_REGISTRY/nginx:$IMAGE_TAG \
            --tag $DOCKER_REGISTRY/nginx:staging-latest \
            docker/nginx

      - name: Push Images to Registry
        run: |
          docker push $DOCKER_REGISTRY/server:$IMAGE_TAG
          docker push $DOCKER_REGISTRY/server:staging-latest
          docker push $DOCKER_REGISTRY/web:$IMAGE_TAG
          docker push $DOCKER_REGISTRY/web:staging-latest
          docker push $DOCKER_REGISTRY/nginx:$IMAGE_TAG
          docker push $DOCKER_REGISTRY/nginx:staging-latest

      - name: Deploy to Staging Droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/loopingon-staging

            doctl registry login --expiry-seconds 300

            echo "IMAGE_TAG=${{ github.sha }}" > .env.deploy

            docker compose -f docker/docker-compose.prod.yml pull

            docker compose -f docker/docker-compose.prod.yml up -d --remove-orphans

            docker compose -f docker/docker-compose.prod.yml exec -T server npx prisma migrate deploy

            docker image prune -af --filter "until=24h"

            docker compose -f docker/docker-compose.prod.yml ps

            sleep 5

            curl -f http://localhost:4000/health || echo "Health check failed, checking in 30s..."
            sleep 30
            curl -f http://localhost:4000/health || exit 1

            echo "Staging deployment complete: ${{ github.sha }}"
