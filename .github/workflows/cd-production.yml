name: CD Production

on:
  push:
    branches: [main]

env:
  DOCKER_REGISTRY: registry.digitalocean.com/loopingon
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    name: Build & Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Login to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 600

      - name: Build Server Docker Image
        run: |
          docker build \
            --file apps/server/Dockerfile \
            --tag $DOCKER_REGISTRY/server:$IMAGE_TAG \
            --tag $DOCKER_REGISTRY/server:latest \
            .

      - name: Build Web Docker Image
        run: |
          docker build \
            --file apps/web/Dockerfile \
            --tag $DOCKER_REGISTRY/web:$IMAGE_TAG \
            --tag $DOCKER_REGISTRY/web:latest \
            .

      - name: Build Nginx Docker Image
        run: |
          docker build \
            --file docker/nginx/Dockerfile \
            --tag $DOCKER_REGISTRY/nginx:$IMAGE_TAG \
            --tag $DOCKER_REGISTRY/nginx:latest \
            docker/nginx

      - name: Push Images to Registry
        run: |
          docker push $DOCKER_REGISTRY/server:$IMAGE_TAG
          docker push $DOCKER_REGISTRY/server:latest
          docker push $DOCKER_REGISTRY/web:$IMAGE_TAG
          docker push $DOCKER_REGISTRY/web:latest
          docker push $DOCKER_REGISTRY/nginx:$IMAGE_TAG
          docker push $DOCKER_REGISTRY/nginx:latest

      - name: Database Backup Before Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/loopingon
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            BACKUP_FILE="/opt/backups/predeploy_${TIMESTAMP}.sql.gz"
            mkdir -p /opt/backups
            docker compose -f docker/docker-compose.prod.yml exec -T postgres pg_dump -U ${POSTGRES_USER} ${POSTGRES_DB} | gzip > $BACKUP_FILE
            echo "Pre-deploy backup created: $BACKUP_FILE"

      - name: Deploy to Production Droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/loopingon

            doctl registry login --expiry-seconds 300

            echo "IMAGE_TAG=${{ github.sha }}" > .env.deploy
            export IMAGE_TAG=${{ github.sha }}

            echo "Running automated SSL certificate setup..."
            chmod +x scripts/setup-ssl.sh
            ./scripts/setup-ssl.sh

            docker compose -f docker/docker-compose.prod.yml pull

            docker compose -f docker/docker-compose.prod.yml up -d --remove-orphans

            docker compose -f docker/docker-compose.prod.yml exec -T server npx prisma migrate deploy

            docker image prune -af --filter "until=72h"

            docker compose -f docker/docker-compose.prod.yml ps

            sleep 5

            curl -f http://localhost:4000/health || echo "Health check failed, retrying in 30s..."
            sleep 30
            curl -f http://localhost:4000/health || exit 1

            echo "Production deployment complete: ${{ github.sha }}"

      - name: Notify on Failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/loopingon
            echo "DEPLOY FAILED: Rolling back to previous version"
            export IMAGE_TAG=latest
            docker compose -f docker/docker-compose.prod.yml up -d --remove-orphans
