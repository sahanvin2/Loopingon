version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: loopingon-postgres-prod
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - loopingon_prod_network

  redis:
    image: redis:7-alpine
    container_name: loopingon-redis-prod
    restart: always
    ports:
      - "6379:6379"
    command: >
      sh -c 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    env_file:
      - ../.env
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - loopingon_prod_network

  server:
    build:
      context: ../apps/server
      dockerfile: Dockerfile
    container_name: loopingon-server-prod
    restart: always
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - loopingon_prod_network

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: loopingon-web-prod
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - loopingon_prod_network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: loopingon-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - server
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - loopingon_prod_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  loopingon_prod_network:
    driver: bridge
