version: "3.8"

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: loopingon-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loopingon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loopingon_secret}
      POSTGRES_DB: ${POSTGRES_DB:-loopingon}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loopingon} -d ${POSTGRES_DB:-loopingon}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loopingon_prod_network

  redis:
    image: redis:7-alpine
    container_name: loopingon-redis-prod
    restart: always
    ports:
      - "6379:6379"
    command: >
      sh -c 'exec redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASSWORD"'
    env_file:
      - ../.env
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    networks:
      - loopingon_prod_network

  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
      target: runner
    image: ${DOCKER_REGISTRY:-registry.digitalocean.com/loopingon}/server:${IMAGE_TAG:-latest}
    container_name: loopingon-server-prod
    restart: always
    ports:
      - "127.0.0.1:4005:4000"
    depends_on:

      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-loopingon}:${POSTGRES_PASSWORD:-loopingon_secret}@postgres:5432/${POSTGRES_DB:-loopingon}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-loopingon}:${POSTGRES_PASSWORD:-loopingon_secret}@postgres:5432/${POSTGRES_DB:-loopingon}?schema=public
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
        reservations:
          memory: 256m
          cpus: "0.5"
    networks:
      - loopingon_prod_network

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: runner
    image: ${DOCKER_REGISTRY:-registry.digitalocean.com/loopingon}/web:${IMAGE_TAG:-latest}
    container_name: loopingon-web-prod
    restart: always
    ports:
      - "127.0.0.1:3005:3000"
    depends_on:
      server:
        condition: service_healthy
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
        reservations:
          memory: 256m
          cpus: "0.5"
    networks:
      - loopingon_prod_network

  worker:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
      target: runner
    image: ${DOCKER_REGISTRY:-registry.digitalocean.com/loopingon}/server:${IMAGE_TAG:-latest}
    container_name: loopingon-worker-prod
    restart: always
    command: node dist/workers/index.worker.js
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-loopingon}:${POSTGRES_PASSWORD:-loopingon_secret}@postgres:5432/${POSTGRES_DB:-loopingon}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-loopingon}:${POSTGRES_PASSWORD:-loopingon_secret}@postgres:5432/${POSTGRES_DB:-loopingon}?schema=public
      NODE_ENV: production
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
        reservations:
          memory: 128m
          cpus: "0.25"
    networks:
      - loopingon_prod_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  loopingon_prod_network:
    driver: bridge
